name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  check:
    name: Check if release needed
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check changed paths
        id: check
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          LATEST=${LATEST:-v0.0.0}

          if git rev-parse "$LATEST" >/dev/null 2>&1; then
            RANGE="${LATEST}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Count files changed outside of app/
          NON_APP=$(git diff --name-only ${RANGE} | grep -vE '^app/' | wc -l | tr -d ' ')

          if [ "$NON_APP" -eq 0 ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Only app/ changes detected — skipping release"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Server-side changes detected ($NON_APP files) — proceeding with release"
          fi

  version:
    name: Compute Version
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_release == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.changelog.outputs.notes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          LATEST=${LATEST:-v0.0.0}

          MAJOR=$(echo $LATEST | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo $LATEST | cut -d. -f2)
          PATCH=$(echo $LATEST | cut -d. -f3)

          if git rev-parse "$LATEST" >/dev/null 2>&1; then
            COMMITS=$(git log ${LATEST}..HEAD --pretty=format:"%s")
          else
            COMMITS=$(git log HEAD --pretty=format:"%s")
          fi

          if echo "$COMMITS" | grep -qE '^(feat!|fix!|BREAKING CHANGE)'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -qE '^feat'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "Next version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          LATEST=${LATEST:-v0.0.0}
          {
            echo 'notes<<EOF'
            echo "## What's Changed in ${{ steps.version.outputs.tag }}"
            echo ""
            if git rev-parse "$LATEST" >/dev/null 2>&1; then
              git log ${LATEST}..HEAD --pretty=format:"- %s (%h)" --reverse
            else
              git log HEAD --pretty=format:"- %s (%h)" --reverse
            fi
            echo ""
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU (multi-arch ARM64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ needs.version.outputs.tag }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ needs.version.outputs.tag }}
            ghcr.io/${{ github.repository }}/frontend:latest
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            GITHUB_REPO=${{ github.repository }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push telegram-bot image
        uses: docker/build-push-action@v6
        with:
          context: ./telegram-bot
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/telegram-bot:${{ needs.version.outputs.tag }}
            ghcr.io/${{ github.repository }}/telegram-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build-and-push]

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Finance Control ${{ needs.version.outputs.tag }}"
          body: ${{ needs.version.outputs.notes }}
          draft: false
          prerelease: false
