services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:${RELEASE_TAG}
    container_name: finance_backend
    restart: always
    env_file: .env.prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:${RELEASE_TAG}
    container_name: finance_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

  telegram-bot:
    image: ghcr.io/${GITHUB_REPOSITORY}/telegram-bot:${RELEASE_TAG}
    container_name: finance_telegram_bot
    restart: always
    env_file: .env.prod
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  mcp-server:
    image: ghcr.io/${GITHUB_REPOSITORY}/mcp-server:${RELEASE_TAG}
    container_name: finance_mcp
    restart: always
    env_file: .env.prod
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - backend
