name: finance_control
description: Finance Control app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.7.0
  # Auth token storage
  flutter_secure_storage: ^9.2.2
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Navigation
  go_router: ^14.6.2
  # Charts
  fl_chart: ^0.70.2
  # Forms
  reactive_forms: ^17.0.1
  # Utils
  intl: ^0.20.2
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  url_launcher: ^6.3.1
  window_manager: ^0.4.3
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#6366f1"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21
  macos:
    generate: true
    image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
  linux:
    generate: true
    image_path: "assets/icon.png"
