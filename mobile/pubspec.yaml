name: finance_control
description: Finance Control mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.7.0
  # Auth token storage
  flutter_secure_storage: ^9.2.2
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Navigation
  go_router: ^14.6.2
  # Charts
  fl_chart: ^0.70.2
  # Forms
  reactive_forms: ^17.0.1
  # Utils
  intl: ^0.20.2
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
